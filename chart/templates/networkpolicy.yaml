{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ai-agent-api.fullname" . }}
  labels:
    {{- include "ai-agent-api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ai-agent-api.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressNamespaceLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Bedrock requires HTTPS. Restrict further with your CNI/FQDN policy if available.
    - ports:
        - protocol: TCP
          port: 443
{{- end }}
