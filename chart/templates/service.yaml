apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-agent-api.fullname" . }}
  labels:
    {{- include "ai-agent-api.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "ai-agent-api.selectorLabels" . | nindent 4 }}
{{- if .Values.blueGreen.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-agent-api.fullname" . }}-preview
  labels:
    {{- include "ai-agent-api.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "ai-agent-api.selectorLabels" . | nindent 4 }}
{{- end }}
